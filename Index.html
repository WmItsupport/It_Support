<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Wheelsmart - IT Department Service Request</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 16px; color: #1e293b; }
    .container { max-width: 600px; margin: 0 auto; }
    .header {
      background: #0f172a; color: #fff; padding: 16px 20px; border-radius: 12px 12px 0 0;
      display: flex; align-items: center; gap: 14px;
    }
    .logo-box {
      width: 48px; height: 48px; background: #ffffff; border-radius: 10px;
      padding: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-box img {
      max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block;
    }
    .header h1 { margin: 0; font-size: 20px; line-height: 1.25; }
    .header span { font-size: 13px; color: #38bdf8; font-weight: 600; display: block; margin-top: 2px; }
    .card, .status-box {
      background: #fff; padding: 20px; border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06); margin-bottom: 18px;
    }
    .card { border-radius: 0 0 12px 12px; }
    .status-row { display: flex; gap: 8px; margin-top: 8px; }
    .status-row input { flex: 1; margin-top: 0; }
    .status-row button { width: auto; margin-top: 0; padding: 10px 18px; background: #0284c7; }
    label { display: block; margin-top: 14px; font-weight: 600; font-size: 13.5px; color: #334155; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; margin-top: 6px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 14px; background: #fff;
    }
    input[readonly] { background: #e2e8f0; color: #475569; font-weight: 600; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .grid-2 { grid-template-columns: 1fr; } }

    .combo-wrap { position: relative; }
    .combo-list {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 999;
      background: #fff; border: 1px solid #2563eb; border-top: none;
      border-radius: 0 0 8px 8px; max-height: 210px; overflow-y: auto;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16); display: none;
    }
    .combo-item {
      padding: 10px 12px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9;
    }
    .combo-item:last-child { border-bottom: none; }
    .combo-item:hover, .combo-item.active { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
    .combo-empty { padding: 10px 12px; font-size: 13px; color: #64748b; }

    button {
      width: 100%; margin-top: 20px; padding: 12px; background: #2563eb; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .alert { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; line-height: 1.5; }
    .success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .info { background: #e0f2fe; color: #075985; border: 1px solid #7dd3fc; }
    .hp-field { display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo-box">
      <img src="https://appv2.wheelsmart.in/static/media/wheelsmart_logo_color-2.da36b7bf923afeb003a101a033c123e7.svg" alt="Wheelsmart Logo" />
    </div>
    <div>
      <h1>Wheelsmart</h1>
      <span>IT Department — Service Request Portal</span>
    </div>
  </div>

  <div class="status-box">
    <strong style="font-size: 14px;">🔍 Check Ticket Status</strong>
    <div class="status-row">
      <input type="text" id="checkTicketId" placeholder="Enter Ticket ID (e.g. WS-1001)" />
      <button type="button" onclick="checkTicketStatus()">Check</button>
    </div>
    <div id="statusResult" class="alert"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Raise New IT Request</h3>
    <form id="reqForm">
      <input type="text" id="website" class="hp-field" autocomplete="off" />

      <div class="grid-2">
        <div>
          <label>Date (Auto)</label>
          <input type="text" id="autoDate" readonly />
        </div>
        <div>
          <label>Employee Name *</label>
          <input type="text" id="name" placeholder="Your full name" required />
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>WhatsApp Number *</label>
          <input type="tel" id="whatsapp" placeholder="10-digit mobile number" pattern="[0-9]{10}" required />
        </div>
        <div>
          <label>Counter *</label>
          <div class="combo-wrap" id="counterCombo">
            <input type="text" id="counterInput" placeholder="Type counter & press Enter..." autocomplete="off" required />
            <input type="hidden" id="counter" />
            <div class="combo-list" id="counterList"></div>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>IT Support Group *</label>
          <select id="group" onchange="updateCategories()" required>
            <option value="">-- Select Group --</option>
            <option value="Networking">Networking</option>
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
          </select>
        </div>
        <div>
          <label>Issue Category *</label>
          <select id="category" required>
            <option value="">-- Select Group First --</option>
          </select>
        </div>
      </div>

      <label>Urgency</label>
      <select id="urgency">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>

      <label>Problem Description *</label>
      <textarea id="issue" rows="3" placeholder="Describe your issue clearly..." required></textarea>

      <label>Attach Photo / Screenshot (Optional)</label>
      <input type="file" id="photoInput" accept="image/*" />

      <button type="submit" id="submitBtn">Submit Service Request</button>
    </form>
    <div id="formMsg" class="alert"></div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1sIz2cipR99VMTRMBYRDC0sf0DC2e0TudJb4CBtfJ4mAKO5W6F-pAOssDyFeNq-oP7w/exec";

  let CATEGORIES = {
    Networking: ["Internet / LAN", "Wi-Fi / Router", "Printer / Scanner Network"],
    Hardware: ["Desktop / Monitor", "Barcode Scanner / POS", "Power / UPS / Cables"],
    Software: ["Wheelsmart App", "Billing / ERP", "OS / Browser / Login"]
  };
  let ALL_COUNTERS = ["AKPBALAJI"];
  let CURRENT_MATCHES = [];
  let ACTIVE_INDEX = 0;

  function toTitleCase(str) {
    return String(str || "")
      .trim()
      .replace(/\s+/g, " ")
      .replace(/\S+/g, word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase());
  }

  function getTodayDateOnly() {
    try {
      const now = new Date();
      return now.toLocaleDateString("en-GB", {
        day: "2-digit", month: "short", year: "numeric"
      });
    } catch (e) {
      return new Date().toISOString().slice(0, 10);
    }
  }

  function setAutoDate() {
    const el = document.getElementById("autoDate");
    if (el) el.value = getTodayDateOnly();
  }

  function highlightActiveItem() {
    const listEl = document.getElementById("counterList");
    const items = listEl.querySelectorAll(".combo-item");
    items.forEach((item, idx) => {
      if (idx === ACTIVE_INDEX) {
        item.classList.add("active");
        item.scrollIntoView({ block: "nearest" });
      } else {
        item.classList.remove("active");
      }
    });
  }

  function renderCounterDropdown(filterText) {
    const listEl = document.getElementById("counterList");
    const q = String(filterText || "").trim().toLowerCase();

    CURRENT_MATCHES = q
      ? ALL_COUNTERS.filter(c => c.toLowerCase().includes(q))
      : ALL_COUNTERS.slice();

    ACTIVE_INDEX = 0;

    if (CURRENT_MATCHES.length === 0) {
      listEl.innerHTML = '<div class="combo-empty">No matching counter found</div>';
      listEl.style.display = "block";
      return;
    }

    listEl.innerHTML = CURRENT_MATCHES.map((c, idx) => {
      const safeAttr = c.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      const safeText = c.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const activeClass = idx === 0 ? " active" : "";
      return `<div class="combo-item${activeClass}" data-counter="${safeAttr}" onmousedown="selectCounterFromEl(this)">${safeText}</div>`;
    }).join("");
    listEl.style.display = "block";
  }

  function selectCounterValue(val) {
    if (!val) return;
    document.getElementById("counterInput").value = val;
    document.getElementById("counter").value = val;
    document.getElementById("counterList").style.display = "none";
  }

  function selectCounterFromEl(el) {
    const val = el.getAttribute("data-counter") || "";
    selectCounterValue(val);
  }

  function setupCounterSearch() {
    const inputEl = document.getElementById("counterInput");
    const hiddenEl = document.getElementById("counter");
    const listEl = document.getElementById("counterList");

    inputEl.addEventListener("focus", () => {
      renderCounterDropdown(inputEl.value);
    });

    inputEl.addEventListener("click", () => {
      renderCounterDropdown(inputEl.value);
    });

    inputEl.addEventListener("input", () => {
      const typed = inputEl.value;
      const exactMatch = ALL_COUNTERS.find(c => c.toLowerCase() === typed.trim().toLowerCase());
      hiddenEl.value = exactMatch ? exactMatch : "";
      renderCounterDropdown(typed);
    });

    inputEl.addEventListener("keydown", (e) => {
      const isOpen = listEl.style.display === "block";

      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!isOpen) {
          renderCounterDropdown(inputEl.value);
        } else if (CURRENT_MATCHES.length > 0) {
          ACTIVE_INDEX = (ACTIVE_INDEX + 1) % CURRENT_MATCHES.length;
          highlightActiveItem();
        }
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (isOpen && CURRENT_MATCHES.length > 0) {
          ACTIVE_INDEX = (ACTIVE_INDEX - 1 + CURRENT_MATCHES.length) % CURRENT_MATCHES.length;
          highlightActiveItem();
        }
      } else if (e.key === "Enter") {
        if (isOpen && CURRENT_MATCHES.length > 0) {
          e.preventDefault();
          const chosen = CURRENT_MATCHES[ACTIVE_INDEX] || CURRENT_MATCHES[0];
          selectCounterValue(chosen);
        }
      } else if (e.key === "Escape") {
        listEl.style.display = "none";
      }
    });

    document.addEventListener("click", (e) => {
      if (!document.getElementById("counterCombo").contains(e.target)) {
        listEl.style.display = "none";
      }
    });
  }

  function loadCounters() {
    if (!SCRIPT_URL || SCRIPT_URL.indexOf("http") !== 0) return;
    fetch(SCRIPT_URL + "?action=getCounters")
      .then(r => r.json())
      .then(data => {
        if (data && data.status === "success" && Array.isArray(data.counters) && data.counters.length > 0) {
          const cleaned = data.counters.map(x => String(x || "").trim()).filter(Boolean);
          if (cleaned.length > 0) {
            ALL_COUNTERS = Array.from(new Set(cleaned));
          }
        }
      })
      .catch(() => {});
  }

  function loadCategories() {
    if (!SCRIPT_URL || SCRIPT_URL.indexOf("http") !== 0) return;
    fetch(SCRIPT_URL + "?action=getCategories")
      .then(r => r.json())
      .then(data => {
        if (data && data.status === "success" && data.categories && typeof data.categories === "object") {
          const hasAny = Object.keys(data.categories).some(k => Array.isArray(data.categories[k]) && data.categories[k].length > 0);
          if (hasAny) {
            CATEGORIES = data.categories;
          }
        }
      })
      .catch(() => {});
  }

  function updateCategories() {
    const grp = document.getElementById("group").value;
    const catSel = document.getElementById("category");
    catSel.innerHTML = '<option value="">-- Select Category --</option>';
    if (CATEGORIES[grp]) {
      CATEGORIES[grp].forEach(item => {
        const opt = document.createElement("option");
        opt.value = item;
        opt.textContent = item;
        catSel.appendChild(opt);
      });
    }
  }

  function compressImage(file) {
    return new Promise((resolve) => {
      if (!file) return resolve({ base64: "", mime: "" });
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxDim = 1024;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
          resolve({ base64: dataUrl.split(",")[1], mime: "image/jpeg" });
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("reqForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("formMsg");
    msg.style.display = "none";

    const typedCounter = document.getElementById("counterInput").value.trim();
    const matchedCounter = ALL_COUNTERS.find(c => c.toLowerCase() === typedCounter.toLowerCase());
    if (!matchedCounter) {
      msg.className = "alert error";
      msg.innerText = "❌ Please select a counter from the dropdown list (type & press Enter or click).";
      msg.style.display = "block";
      document.getElementById("counterInput").focus();
      renderCounterDropdown(typedCounter);
      return;
    }

    const formattedName = toTitleCase(document.getElementById("name").value);
    const formattedIssue = toTitleCase(document.getElementById("issue").value);
    const cleanPhone = document.getElementById("whatsapp").value.replace(/\D/g, "");
    const dateOnly = getTodayDateOnly();
    const grpVal = document.getElementById("group").value;
    const catVal = document.getElementById("category").value;

    btn.disabled = true;
    btn.innerText = "Submitting Request...";

    const file = document.getElementById("photoInput").files[0];
    const photoData = await compressImage(file);

    const payload = {
      action: "submitRequest",
      website: document.getElementById("website").value,
      dateOnly: dateOnly,
      name: formattedName,
      whatsapp: cleanPhone,
      counter: matchedCounter,
      urgency: document.getElementById("urgency").value,
      group: grpVal,
      category: catVal,
      issue: formattedIssue,
      photoBase64: photoData.base64,
      photoMime: photoData.mime
    };

    fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          msg.className = "alert success";
          msg.innerHTML =
            "✅ Request Submitted! Your Ticket ID: <strong>" + res.ticketId + "</strong><br>" +
            "<small>Save this Ticket ID to check status anytime.</small>";
          msg.style.display = "block";

          document.getElementById("reqForm").reset();
          document.getElementById("counter").value = "";
          setAutoDate();
          updateCategories();
        } else {
          msg.className = "alert error";
          msg.innerText = "❌ " + (res.message || "Submission failed");
          msg.style.display = "block";
        }
      })
      .catch(() => {
        msg.className = "alert error";
        msg.innerText = "❌ Network error. Please try again.";
        msg.style.display = "block";
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "Submit Service Request";
      });
  });

  function checkTicketStatus() {
    const tid = document.getElementById("checkTicketId").value.trim();
    const box = document.getElementById("statusResult");
    if (!tid) return;
    box.className = "alert info";
    box.innerText = "Checking status...";
    box.style.display = "block";

    fetch(SCRIPT_URL + "?action=checkStatus&ticketId=" + encodeURIComponent(tid))
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          const t = res.ticket;
          const isDone = t.ticketStatus === "Completed";
          box.className = isDone ? "alert success" : "alert info";
          box.innerHTML = `<strong>${t.ticketId}</strong> (${t.group} - ${t.category})<br>
            Status: <strong>${t.ticketStatus}</strong> ${isDone ? "✅" : "⏳"}<br>
            ${t.completedBy ? "Handled By: " + t.completedBy + "<br>" : ""}
            ${t.remarks ? "Remarks: " + t.remarks : ""}`;
        } else {
          box.className = "alert error";
          box.innerText = "❌ " + res.message;
        }
      })
      .catch(() => {
        box.className = "alert error";
        box.innerText = "❌ Error fetching ticket status.";
      });
  }

  setAutoDate();
  setupCounterSearch();
  loadCounters();
  loadCategories();
</script>
</body>
</html>
