<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Wheelsmart - IT Department - Service Work Portal</title>
  <style>
- { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { margin: 0; padding: 14px; background: #f1f5f9; color: #1e293b; }
    .container { max-width: 980px; margin: 0 auto; }

    .header {
      background: #0f172a; color: #fff; padding: 14px 18px; border-radius: 12px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo-box {
      width: 44px; height: 44px; background: #ffffff; border-radius: 9px;
      padding: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-box img {
      max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block;
    }
    .header h1 { margin: 0; font-size: 19px; line-height: 1.2; }
    .header span { font-size: 12.5px; color: #38bdf8; font-weight: 600; display: block; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .auto-badge {
      font-size: 11.5px; color: #cbd5e1; background: rgba(255,255,255,0.08);
      padding: 6px 10px; border-radius: 8px; font-weight: 600;
    }
    .btn-refresh {
      background: #2563eb; color: #fff; border: none; padding: 9px 15px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .btn-refresh:hover { background: #1d4ed8; }

    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 9px; margin-bottom: 14px;
    }
    .stat-card {
      background: #fff; padding: 10px 13px; border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05); border-left: 4px solid #2563eb;
    }
    .stat-card.high { border-left-color: #dc2626; }
    .stat-card.med { border-left-color: #d97706; }
    .stat-card.low { border-left-color: #0284c7; }
    .stat-card.net { border-left-color: #0891b2; }
    .stat-card.hw { border-left-color: #ea580c; }
    .stat-card.sw { border-left-color: #7c3aed; }
    .stat-label { font-size: 11.5px; color: #64748b; font-weight: 600; }
    .stat-val { font-size: 19px; font-weight: 700; margin-top: 2px; color: #0f172a; }

    .quick-tabs {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
    }
    .tab-btn {
      background: #fff; color: #334155; border: 1px solid #cbd5e1;
      padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease;
    }
    .tab-btn:hover { background: #eff6ff; border-color: #93c5fd; }
    .tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    input {
      width: 100%; padding: 9px 11px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 13px; background: #fff;
    }

    .ticket-list { display: grid; gap: 11px; }
    .ticket-card {
      background: #fff; border-radius: 12px; padding: 14px 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;
    }
    .ticket-top {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 6px; margin-bottom: 8px; padding-bottom: 7px; border-bottom: 1px solid #f1f5f9;
    }
    .tid { font-weight: 700; font-size: 15px; color: #0f172a; margin-right: 6px; }
    .badge {
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
      display: inline-block; margin-right: 4px;
    }
    .urg-High { background: #fee2e2; color: #991b1b; }
    .urg-Medium { background: #fef3c7; color: #92400e; }
    .urg-Low { background: #e0f2fe; color: #075985; }
    .grp-badge { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .st-Open, .st-Pending { background: #dbeafe; color: #1e40af; }

    .details-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 5px 12px; font-size: 12.5px; color: #334155; margin-bottom: 8px;
    }
    .detail-item strong { color: #0f172a; }

    .issue-box {
      background: #f8fafc; padding: 9px 12px; border-radius: 8px;
      font-size: 13px; color: #1e293b; margin-bottom: 8px; border: 1px solid #e2e8f0;
      line-height: 1.4;
    }
    .photo-btn {
      background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe;
      padding: 5px 10px; border-radius: 7px; font-size: 12px; font-weight: 600;
      cursor: pointer; margin-bottom: 8px; display: inline-block;
    }
    .photo-btn:hover { background: #dbeafe; }

    .complete-box {
      display: grid; grid-template-columns: 1fr 2fr auto; gap: 8px; margin-top: 6px;
    }
    @media (max-width: 640px) {
      .complete-box { grid-template-columns: 1fr; }
    }
    .btn-done {
      background: #16a34a; color: #fff; border: none; padding: 9px 15px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .btn-done:hover { background: #15803d; }
    .btn-done:disabled { background: #94a3b8; cursor: not-allowed; }

    .msg { padding: 11px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; display: none; }
    .msg.ok { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .msg.err { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .empty {
      background: #fff; padding: 24px; text-align: center; border-radius: 12px;
      color: #64748b; font-size: 13.5px; box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    /* Screen Photo Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 2000;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: #fff; border-radius: 12px; max-width: 780px; width: 100%;
      padding: 14px; box-shadow: 0 20px 45px rgba(0,0,0,0.35);
    }
    .modal-top {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px;
    }
    .modal-title { font-weight: 700; font-size: 14px; color: #0f172a; }
    .modal-close {
      background: #ef4444; color: #fff; border: none; border-radius: 7px;
      padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .modal-img {
      width: 100%; max-height: 74vh; object-fit: contain; border-radius: 8px;
      background: #f8fafc; display: block;
    }
    .modal-note {
      display: none; padding: 18px; text-align: center; font-size: 13px; color: #64748b;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="logo-box">
        <img src="https://appv2.wheelsmart.in/static/media/wheelsmart_logo_color-2.da36b7bf923afeb003a101a033c123e7.svg" alt="Wheelsmart Logo" />
      </div>
      <div>
        <h1>Wheelsmart</h1>
        <span>IT Department - Service Work Portal</span>
      </div>
    </div>
    <div class="header-right">
      <span class="auto-badge" id="autoSyncStatus">Auto-refresh: 30s</span>
      <button class="btn-refresh" onclick="loadTickets(false)">↻ Refresh Tickets</button>
    </div>
  </div>

  <div id="bannerMsg" class="msg"></div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Pending Tickets</div>
      <div class="stat-val" id="cntOpen">0</div>
    </div>
    <div class="stat-card high">
      <div class="stat-label">High Urgency</div>
      <div class="stat-val" id="cntHigh">0</div>
    </div>
    <div class="stat-card med">
      <div class="stat-label">Medium Urgency</div>
      <div class="stat-val" id="cntMed">0</div>
    </div>
    <div class="stat-card low">
      <div class="stat-label">Low Urgency</div>
      <div class="stat-val" id="cntLow">0</div>
    </div>
    <div class="stat-card net">
      <div class="stat-label">Networking</div>
      <div class="stat-val" id="cntNet">0</div>
    </div>
    <div class="stat-card hw">
      <div class="stat-label">Hardware</div>
      <div class="stat-val" id="cntHw">0</div>
    </div>
    <div class="stat-card sw">
      <div class="stat-label">Software</div>
      <div class="stat-val" id="cntSw">0</div>
    </div>
  </div>

  <div class="quick-tabs" id="groupTabs">
    <button class="tab-btn active" data-grp="All" onclick="selectGroupTab('All')">All Groups</button>
    <button class="tab-btn" data-grp="Networking" onclick="selectGroupTab('Networking')">Networking</button>
    <button class="tab-btn" data-grp="Hardware" onclick="selectGroupTab('Hardware')">Hardware</button>
    <button class="tab-btn" data-grp="Software" onclick="selectGroupTab('Software')">Software</button>
  </div>

  <div id="ticketContainer" class="ticket-list">
    <div class="empty">Loading tickets...</div>
  </div>
</div>

<!-- Screen Photo Preview Modal -->
<div class="modal-backdrop" id="photoModal" onclick="closePhotoModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-top">
      <span class="modal-title" id="modalTitle">Attached Photo</span>
      <button class="modal-close" onclick="closePhotoModal()">✕ Close</button>
    </div>
    <img id="modalImg" class="modal-img" src="" alt="Ticket Attachment" />
    <div id="modalNote" class="modal-note">Photo preview unavailable for this ticket.</div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1sIz2cipR99VMTRMBYRDC0sf0DC2e0TudJb4CBtfJ4mAKO5W6F-pAOssDyFeNq-oP7w/exec";
  const AUTO_REFRESH_MS = 30000;

  let ALL_TICKETS = [];
  let SELECTED_GROUP = "All";
  let isFetching = false;

  function formatDateOnly(val) {
    const raw = String(val || "").trim();
    if (!raw) return "";

    // Strip trailing time/timezone if present like "Fri Nov 20 2026 00:00:00 GMT+0530 (India Standard Time)"
    const cleaned = raw
      .replace(/\s+\d{1,2}:\d{2}(:\d{2})?(\s*(AM|PM))?(\s*GMT[+-]\d{4}.*)?$/i, "")
      .replace(/,\s*\d{1,2}:\d{2}(:\d{2})?(\s*(AM|PM))?.*$/i, "")
      .trim();

    if (cleaned) return cleaned;

    const d = new Date(raw);
    if (!isNaN(d.getTime())) {
      return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    }
    return raw;
  }

  function isPendingTicket(t) {
    const st = String(t.status || "Open").trim().toLowerCase();
    return st !== "completed" && st !== "closed" && st !== "resolved" && st !== "done";
  }

  function toTitleCaseLive(str) {
    return String(str || "").replace(/(^|\s+)([a-zA-Z])/g, function(match, space, ch) {
      return space + ch.toUpperCase();
    });
  }

  function toTitleCaseFinal(str) {
    return String(str || "")
      .trim()
      .replace(/\s+/g, " ")
      .replace(/\S+/g, function(word) {
        return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
      });
  }

  function formatFieldInput(inputEl) {
    if (!inputEl) return;
    const start = inputEl.selectionStart;
    const end = inputEl.selectionEnd;
    const formatted = toTitleCaseLive(inputEl.value);
    if (formatted !== inputEl.value) {
      inputEl.value = formatted;
      try { inputEl.setSelectionRange(start, end); } catch (e) {}
    }
  }

  function showBanner(text, isError) {
    const el = document.getElementById("bannerMsg");
    el.className = "msg " + (isError ? "err" : "ok");
    el.textContent = text;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 4500);
  }

  function esc(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function selectGroupTab(grp) {
    SELECTED_GROUP = grp;
    document.querySelectorAll("#groupTabs .tab-btn").forEach(btn => {
      btn.classList.toggle("active", btn.getAttribute("data-grp") === grp);
    });
    renderTickets();
  }

  function openPhotoModalById(ticketId) {
    const t = ALL_TICKETS.find(item => String(item.ticketId) === String(ticketId));
    const imgEl = document.getElementById("modalImg");
    const noteEl = document.getElementById("modalNote");

    document.getElementById("modalTitle").textContent = "Attached Photo — " + ticketId;
    const src = (t && t.photoDataUrl) ? t.photoDataUrl : "";

    if (src) {
      noteEl.style.display = "none";
      imgEl.style.display = "block";
      imgEl.src = src;
    } else {
      imgEl.style.display = "none";
      imgEl.src = "";
      noteEl.style.display = "block";
    }
    document.getElementById("photoModal").classList.add("open");
  }

  function closePhotoModal(e) {
    if (e && e.target !== document.getElementById("photoModal")) return;
    document.getElementById("photoModal").classList.remove("open");
    document.getElementById("modalImg").src = "";
  }

  function updateStats() {
    const pending = ALL_TICKETS.filter(isPendingTicket);
    document.getElementById("cntOpen").textContent = pending.length;
    document.getElementById("cntHigh").textContent = pending.filter(t => String(t.urgency || "").toLowerCase() === "high").length;
    document.getElementById("cntMed").textContent = pending.filter(t => String(t.urgency || "medium").toLowerCase() === "medium").length;
    document.getElementById("cntLow").textContent = pending.filter(t => String(t.urgency || "").toLowerCase() === "low").length;
    document.getElementById("cntNet").textContent = pending.filter(t => t.group === "Networking").length;
    document.getElementById("cntHw").textContent = pending.filter(t => t.group === "Hardware").length;
    document.getElementById("cntSw").textContent = pending.filter(t => t.group === "Software").length;
  }

  function hasActiveInputInList() {
    const active = document.activeElement;
    if (!active || !active.closest || !active.closest("#ticketContainer")) return false;
    return active.tagName === "INPUT" && active.value.trim().length > 0;
  }

  function renderTickets() {
    const wrap = document.getElementById("ticketContainer");

    const filtered = ALL_TICKETS.filter(t => {
      if (!isPendingTicket(t)) return false;
      if (SELECTED_GROUP !== "All" && t.group !== SELECTED_GROUP) return false;
      return true;
    });

    if (filtered.length === 0) {
      wrap.innerHTML = '<div class="empty">No pending tickets found.</div>';
      return;
    }

    wrap.innerHTML = filtered.map(t => {
      const statusVal = t.status || "Pending";
      const urgVal = t.urgency || "Medium";
      const urgClass = "urg-" + urgVal.replace(/[^a-zA-Z0-9_-]/g, "");
      const stClass = "st-" + statusVal.replace(/[^a-zA-Z0-9_-]/g, "");
      const safeId = esc(t.ticketId);
      const idKey = safeId.replace(/[^a-zA-Z0-9_-]/g, "_");
      const dateOnly = esc(formatDateOnly(t.date));

      const hasPhoto = Boolean(t.photoDataUrl || t.photoUrl);
      const photoBtnHtml = hasPhoto
        ? `<button type="button" class="photo-btn" onclick="openPhotoModalById('${safeId}')">📷 View Photo</button>`
        : "";

      const locationLine = [
        t.zone ? `<strong>Zone:</strong> ${esc(t.zone)}` : "",
        t.division ? `<strong>Division:</strong> ${esc(t.division)}` : "",
        t.cluster ? `<strong>Cluster:</strong> ${esc(t.cluster)}` : ""
      ].filter(Boolean).join(" &nbsp;|&nbsp; ");

      return `
        <div class="ticket-card">
          <div class="ticket-top">
            <div>
              <span class="tid">${safeId}</span>
              <span class="badge grp-badge">${esc(t.group)} • ${esc(t.category)}</span>
            </div>
            <div>
              <span class="badge ${urgClass}">${esc(urgVal)}</span>
              <span class="badge ${stClass}">${esc(statusVal)}</span>
            </div>
          </div>

          <div class="details-grid">
            <div class="detail-item"><strong>Date:</strong> ${dateOnly}</div>
            <div class="detail-item"><strong>Counter:</strong> ${esc(t.counter)}</div>
            <div class="detail-item"><strong>Employee Name:</strong> ${esc(t.employeeName)}</div>
            <div class="detail-item"><strong>Phone / WhatsApp:</strong> ${esc(t.whatsapp)}</div>
          </div>

          ${locationLine ? `<div class="details-grid"><div class="detail-item">${locationLine}</div></div>` : ""}

          <div class="issue-box">
            <strong>Problem Description:</strong><br>${esc(t.issue)}
          </div>

          ${photoBtnHtml}
          <div class="complete-box">
            <input type="text" id="by_${idKey}" placeholder="Completed By (First Cap Auto) *" oninput="formatFieldInput(this)" />
            <input type="text" id="rem_${idKey}" placeholder="Remarks (First Cap Auto)" oninput="formatFieldInput(this)" />
            <button type="button" class="btn-done" id="btn_${idKey}" onclick="completeTicket('${safeId}', '${idKey}')">✓ Complete</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function completeTicket(ticketId, idKey) {
    const byInput = document.getElementById("by_" + idKey);
    const remInput = document.getElementById("rem_" + idKey);
    const btn = document.getElementById("btn_" + idKey);

    const completedBy = toTitleCaseFinal(byInput ? byInput.value : "");
    const remarks = toTitleCaseFinal(remInput ? remInput.value : "");

    if (byInput) byInput.value = completedBy;
    if (remInput) remInput.value = remarks;

    if (!completedBy) {
      showBanner("Please enter 'Completed By' name before completing ticket " + ticketId + ".", true);
      if (byInput) byInput.focus();
      return;
    }

    const ok = confirm("Mark ticket " + ticketId + " as Completed by " + completedBy + "?");
    if (!ok) return;

    btn.disabled = true;
    btn.textContent = "Updating...";

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "completeTicket",
        ticketId: ticketId,
        status: "Completed",
        completedBy: completedBy,
        remarks: remarks
      })
    })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          showBanner("Ticket " + ticketId + " marked Completed and removed from pending list.", false);
          loadTickets(false);
        } else {
          showBanner(res.message || "Failed to complete ticket.", true);
          btn.disabled = false;
          btn.textContent = "✓ Complete";
        }
      })
      .catch(() => {
        showBanner("Network error while updating ticket.", true);
        btn.disabled = false;
        btn.textContent = "✓ Complete";
      });
  }

  function updateSyncLabel() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    const ss = String(now.getSeconds()).padStart(2, "0");
    document.getElementById("autoSyncStatus").textContent = "Auto-refresh: 30s (Synced " + hh + ":" + mm + ":" + ss + ")";
  }

  function loadTickets(isBackground) {
    if (!SCRIPT_URL || SCRIPT_URL.indexOf("http") !== 0) {
      document.getElementById("ticketContainer").innerHTML =
        '<div class="empty">Set SCRIPT_URL in admin.html to load live tickets.</div>';
      return;
    }
    if (isFetching) return;
    if (isBackground && hasActiveInputInList()) return;

    isFetching = true;
    if (!isBackground && ALL_TICKETS.length === 0) {
      document.getElementById("ticketContainer").innerHTML = '<div class="empty">Loading tickets...</div>';
    }

    fetch(SCRIPT_URL + "?action=getTickets&_t=" + Date.now())
      .then(r => r.json())
      .then(data => {
        if (data && data.status === "success" && Array.isArray(data.tickets)) {
          ALL_TICKETS = data.tickets;
          updateStats();
          renderTickets();
          updateSyncLabel();
        } else if (!isBackground) {
          document.getElementById("ticketContainer").innerHTML =
            '<div class="empty">Could not load tickets: ' + esc(data.message || "Unknown error") + '</div>';
        }
      })
      .catch(() => {
        if (!isBackground && ALL_TICKETS.length === 0) {
          document.getElementById("ticketContainer").innerHTML =
            '<div class="empty">Network error loading tickets.</div>';
        }
      })
      .finally(() => {
        isFetching = false;
      });
  }

  loadTickets(false);
  setInterval(function() {
    loadTickets(true);
  }, AUTO_REFRESH_MS);
</script>
</body>
</html>
